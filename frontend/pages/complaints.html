<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaints • Land Registry System</title>
    <link rel="stylesheet" href="/assets/css/styles.css?v=20260416b" />
    <style>
      .complaint-tabs { display:flex; gap:.75rem; margin-bottom:1.5rem; flex-wrap:wrap; }
      .complaint-tab { padding:.5rem 1.2rem; border-radius:20px; border:1.5px solid #e2e8f0; background:#fff; font-weight:600; font-size:.9rem; cursor:pointer; color:#64748b; transition:all .2s; }
      .complaint-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
      .complaint-card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:1.4rem 1.6rem; margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,.04); transition:box-shadow .2s; }
      .complaint-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.08); }
      .complaint-meta { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin-bottom:.6rem; }
      .complaint-title { font-size:1.05rem; font-weight:700; color:#0f172a; margin:0 0 .4rem 0; }
      .complaint-desc { color:#475569; font-size:.92rem; line-height:1.6; margin:0 0 .8rem 0; }
      .complaint-target { font-size:.85rem; color:#64748b; display:flex; align-items:center; gap:.4rem; }
      .complaint-admin-notes { background:#f8fafc; border-left:3px solid var(--primary); padding:.75rem 1rem; border-radius:0 8px 8px 0; font-size:.9rem; color:#334155; margin-top:.75rem; }
      .status-badge { padding:.25rem .75rem; border-radius:20px; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
      .status-pending { background:#fef9c3; color:#854d0e; }
      .status-under-review { background:#dbeafe; color:#1e40af; }
      .status-resolved { background:#dcfce7; color:#166534; }
      .status-dismissed { background:#fee2e2; color:#991b1b; }
      .type-badge { padding:.2rem .65rem; border-radius:20px; font-size:.78rem; font-weight:600; }
      .type-property { background:#f0fdf4; color:#15803d; }
      .type-officer { background:#fef3c7; color:#92400e; }
      .form-section { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:2rem; margin-bottom:2rem; box-shadow:0 2px 8px rgba(0,0,0,.04); }
      .form-section h3 { margin:0 0 1.5rem 0; font-size:1.2rem; font-weight:700; color:#0f172a; display:flex; align-items:center; gap:.5rem; }
      .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }
      @media(max-width:640px){ .form-grid{ grid-template-columns:1fr; } }
      .form-group { display:flex; flex-direction:column; gap:.4rem; }
      .form-group.full { grid-column:1/-1; }
      .form-group label { font-weight:600; font-size:.9rem; color:#374151; }
      .admin-review-panel { background:#fffbeb; border:1.5px solid #fde68a; border-radius:12px; padding:1.2rem; margin-top:1rem; }
      .admin-review-panel h4 { margin:0 0 .75rem 0; color:#92400e; font-size:.95rem; }
      .empty-state { text-align:center; padding:4rem 2rem; color:#94a3b8; }
      .empty-state .empty-icon { font-size:3rem; margin-bottom:1rem; }
    </style>
  </head>
  <body data-auth="private">
    <header id="navbar-root"></header>

    <main class="container" style="padding-top:2rem; padding-bottom:4rem;">
      <section class="page-header">
        <h1>📋 Complaints</h1>
        <p id="page-subtitle">File and track complaints for review.</p>
      </section>

      <!-- FILE COMPLAINT FORM (shown based on role) -->
      <div id="file-complaint-section"></div>

      <!-- COMPLAINTS LIST -->
      <section>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:.75rem;">
          <h2 style="margin:0; font-size:1.3rem; font-weight:700; color:#0f172a;">
            <span id="list-heading">Complaints</span>
          </h2>
          <div class="complaint-tabs" id="filter-tabs">
            <button class="complaint-tab active" data-status="">All</button>
            <button class="complaint-tab" data-status="Pending">Pending</button>
            <button class="complaint-tab" data-status="Under Review">Under Review</button>
            <button class="complaint-tab" data-status="Resolved">Resolved</button>
            <button class="complaint-tab" data-status="Dismissed">Dismissed</button>
          </div>
        </div>
        <div id="complaints-root"></div>
      </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/navbar.js?v=20260416b"></script>
    <script src="/assets/js/complaints.js"></script>
  </body>
</html>
