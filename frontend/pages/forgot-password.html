<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password • Land Registry System</title>
    <link rel="stylesheet" href="/assets/css/styles.css?v=20260416b" />
  </head>
  <body class="login-page" data-auth="guest" style="display: flex; flex-direction: column; min-height: 100vh;">
    <header id="navbar-root"></header>

    <main class="container" style="flex: 1; margin-bottom: 4rem; display: flex; justify-content: center; align-items: center; min-height: 70vh;">
      <section class="card" style="max-width: 460px; width: 100%; padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h2 style="margin: 0 0 0.5rem 0; color: var(--heading);">Reset Your Password</h2>
          <p style="color: var(--muted); margin: 0;">Enter your email to receive a verification code.</p>
        </div>

        <!-- Step 1: Enter Email -->
        <form id="step-email-form">
          <div id="step-email">
            <div style="margin-bottom: 1.5rem;">
              <label for="reset-email" style="display: block; margin-bottom: 0.25rem;">Email Address</label>
              <input class="input" id="reset-email" type="email" autocomplete="email" placeholder="your.email@example.com" required style="width: 100%;" />
            </div>
            <button class="btn btn-primary" type="submit" id="send-reset-otp-btn" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
              Send Reset Code
            </button>
          </div>
        </form>

        <!-- Step 2: Enter OTP + New Password -->
        <form id="step-reset-form">
          <div id="step-reset" style="display: none;">
            <div style="margin-bottom: 1rem;">
              <label for="reset-otp" style="display: block; margin-bottom: 0.25rem;">Verification Code (OTP)</label>
              <input class="input" id="reset-otp" type="text" autocomplete="one-time-code" placeholder="6-digit code from email" required style="width: 100%;" />
            </div>
            <div style="margin-bottom: 1rem;">
              <label for="new-password" style="display: block; margin-bottom: 0.25rem;">New Password</label>
              <input class="input" id="new-password" type="password" autocomplete="new-password" placeholder="Minimum 8 characters" minlength="8" required style="width: 100%;" />
            </div>
            <div style="margin-bottom: 1.5rem;">
              <label for="confirm-new-password" style="display: block; margin-bottom: 0.25rem;">Confirm New Password</label>
              <input class="input" id="confirm-new-password" type="password" autocomplete="new-password" placeholder="Re-enter password" minlength="8" required style="width: 100%;" />
            </div>
            <button class="btn btn-primary" type="submit" id="reset-password-btn" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
              Reset Password
            </button>
          </div>
        </form>

        <!-- Success Message -->
        <div id="step-success" style="display: none; text-align: center; padding: 2rem 0;">
          <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
          <h3 style="color: var(--heading); margin-bottom: 0.5rem;">Password Reset Successful!</h3>
          <p style="color: var(--muted); margin-bottom: 1.5rem;">You can now login with your new password.</p>
          <a href="login.html" class="btn btn-primary" style="display: inline-block; padding: 0.75rem 2rem;">Go to Login</a>
        </div>

        <p id="reset-message" style="text-align: center; margin-top: 1rem; font-size: 0.875rem;"></p>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #dbe5f0;">
          <p style="color: var(--muted); margin: 0;">Remember your password? 
            <a href="login.html" style="color: var(--gov-blue); font-weight: 600;">Sign In</a>
          </p>
        </div>
      </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/navbar.js?v=20260416b"></script>
    <script>
      const emailForm = document.getElementById("step-email-form");
      const resetForm = document.getElementById("step-reset-form");
      const msgEl = document.getElementById("reset-message");
      let resetEmail = "";

      emailForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const emailInput = document.getElementById("reset-email");
        resetEmail = emailInput.value.trim();
        if (!resetEmail) {
          msgEl.textContent = "Please enter your email";
          msgEl.style.color = "var(--danger)";
          return;
        }

        try {
          const sendBtn = document.getElementById("send-reset-otp-btn");
          sendBtn.disabled = true;
          sendBtn.textContent = "Sending...";
          msgEl.textContent = "";
          await apiRequest("/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email: resetEmail })
          });
          document.getElementById("step-email").style.display = "none";
          document.getElementById("step-reset").style.display = "block";
          msgEl.textContent = "OTP sent to your email!";
          msgEl.style.color = "green";
        } catch (err) {
          msgEl.textContent = err.message;
          msgEl.style.color = "var(--danger)";
          const sendBtn = document.getElementById("send-reset-otp-btn");
          sendBtn.disabled = false;
          sendBtn.textContent = "Send Reset Code";
        }
      });

      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const otp = document.getElementById("reset-otp").value.trim();
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-new-password").value;

        if (!otp) {
          msgEl.textContent = "Please enter the OTP";
          msgEl.style.color = "var(--danger)";
          return;
        }
        if (newPassword.length < 8) {
          msgEl.textContent = "Password must be at least 8 characters";
          msgEl.style.color = "var(--danger)";
          return;
        }
        if (newPassword !== confirmPassword) {
          msgEl.textContent = "Passwords do not match";
          msgEl.style.color = "var(--danger)";
          return;
        }

        try {
          const resetBtn = document.getElementById("reset-password-btn");
          resetBtn.disabled = true;
          resetBtn.textContent = "Resetting...";
          msgEl.textContent = "";
          await apiRequest("/auth/reset-password", {
            method: "POST",
            body: JSON.stringify({ email: resetEmail, otp, newPassword })
          });
          document.getElementById("step-reset").style.display = "none";
          document.getElementById("step-success").style.display = "block";
          msgEl.textContent = "";
        } catch (err) {
          msgEl.textContent = err.message;
          msgEl.style.color = "var(--danger)";
          const resetBtn = document.getElementById("reset-password-btn");
          resetBtn.disabled = false;
          resetBtn.textContent = "Reset Password";
        }
      });
    </script>
  </body>
</html>
